
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <title>摸鱼遥控车控制台</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Dependencies -->
    <script src="https://image.mycodebro.cn/mediapipe/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://image.mycodebro.cn/mediapipe/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://image.mycodebro.cn/mediapipe/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://image.mycodebro.cn/mediapipe/hands.js" crossorigin="anonymous"></script>
    <script src="https://image.mycodebro.cn/mediapipe/face_mesh.js" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' }, // 更深的背景
                        tech: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' }, // 科技蓝
                    },
                    fontFamily: {
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 极简滑块样式 */
        input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; height: 14px; width: 14px; border-radius: 2px;
            background: #38bdf8; cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 5px rgba(56, 189, 248, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #374151; border-radius: 2px;
        }
        /* 禁止文本被选中，提升按钮连点体验 */
        body { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-gray-950 text-gray-300 h-screen w-screen overflow-hidden flex flex-col font-sans">

    <header class="h-14 flex-none bg-gray-900 border-b border-gray-800 flex items-center justify-between px-6 z-20 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-2 h-8 bg-tech-500 rounded-sm shadow-[0_0_8px_rgba(14,165,233,0.6)]"></div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wider leading-tight">摸鱼遥控车 <span class="text-tech-500">驾驶舱</span></h1>
                <div class="text-[10px] text-gray-500 font-mono uppercase tracking-[0.2em]">REMOTE DRIVE SYS // ONLINE</div>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 text-xs font-mono text-gray-300 bg-gray-950/50 px-3 py-1.5 rounded border border-gray-800">
                <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_6px_#22c55e]"></span>
                <span class="text-tech-400 font-semibold">驾驶员: {{ username or '未知用户' }}</span>
            </div>
            
            <div id="status" class="flex items-center gap-2 text-xs font-mono text-gray-400 bg-gray-950/50 px-3 py-1.5 rounded border border-gray-800">
                <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                系统状态: 检测中...
            </div>
            
            <div id="session-timer" class="hidden flex items-center gap-2 border-l border-gray-700 pl-4">
                <span class="text-[10px] text-gray-500 uppercase">剩余燃料:</span>
                <span id="session-remaining" class="text-tech-400 font-mono font-bold text-lg">--:--</span>
            </div>
            
            <!-- 退出控制按钮 -->
            <button onclick="exitControl()" class="px-4 py-2 text-sm font-semibold bg-red-600 hover:bg-red-700 text-white rounded-lg border border-red-500 transition-all shadow-lg hover:shadow-red-500/30 active:scale-95 flex items-center gap-2">
                <span class="text-xs">⏏️</span> 退出控制
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- 摄像头区域 - 靠左边 -->
        <section class="flex-1 flex flex-col bg-black relative order-1 lg:order-1">
            
            <!-- 手腕摄像头 (现在放在上面) -->
            <div class="h-1/2 relative border-b border-gray-800 group overflow-hidden">
                <img id="wrist-camera" src="{{ url_for('video_feed', camera='wrist') }}" class="w-full h-full object-contain bg-gray-950" onerror="this.style.display='none'" />
                
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none -z-10">
                    <span class="text-xs text-gray-700 font-mono">无信号 - 手腕</span>
                </div>

                <div class="absolute top-3 left-3 flex items-center gap-2 bg-black/40 backdrop-blur px-2 py-1 rounded border border-white/10">
                    <div class="w-1.5 h-1.5 rounded-full bg-tech-500 shadow-[0_0_5px_#0ea5e9]"></div>
                    <span class="text-[10px] font-bold text-white tracking-wide">手腕摄像头</span>
                </div>
            </div>

            <!-- 前置摄像头 (现在放在下面，默认关闭) -->
            <div class="h-1/2 relative group overflow-hidden">
                <img id="front-camera" data-src="{{ url_for('video_feed', camera='front') }}" class="w-full h-full object-contain bg-gray-950 hidden" />
                
                <!-- 播放按钮遮罩 -->
                <div id="front-camera-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900/80 backdrop-blur-sm z-10 transition-all duration-300">
                    <button onclick="enableFrontCamera()" class="group relative flex items-center justify-center w-16 h-16 rounded-full bg-tech-500 hover:bg-tech-400 text-white shadow-lg shadow-tech-500/30 transition-all active:scale-95">
                        <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <span class="absolute -bottom-8 text-xs font-mono text-gray-400 group-hover:text-white transition-colors whitespace-nowrap">开启前置视角</span>
                    </button>
                </div>

                <div class="absolute inset-0 flex items-center justify-center pointer-events-none -z-10">
                    <span class="text-xs text-gray-700 font-mono">无信号 - 前置</span>
                </div>

                <div class="absolute top-3 left-3 flex items-center gap-2 bg-black/40 backdrop-blur px-2 py-1 rounded border border-white/10 z-20">
                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_5px_#22c55e]"></div>
                    <span class="text-[10px] font-bold text-white tracking-wide">前置摄像头</span>
                </div>
                <div class="absolute inset-0 opacity-20 pointer-events-none border border-white/5 m-4">
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 border-l border-t border-white/50"></div>
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 border-r border-b border-white/50"></div>
                </div>
            </div>

        </section>
        
        <aside class="lg:w-[420px] flex-none flex flex-col border-l border-gray-800 bg-gray-900/50 backdrop-blur relative z-10 order-2 lg:order-2">
            
            <div class="flex-none p-5 border-b border-gray-800/50">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    底盘机动
                </h3>
                
                <div class="grid grid-cols-3 gap-2 max-w-[260px] mx-auto">
                    <button id="btn-q" data-key="q" class="h-14 bg-gray-800 rounded hover:bg-gray-700 active:bg-tech-600 active:text-white border-b-2 border-gray-950 active:border-b-0 active:translate-y-[2px] transition-all flex flex-col items-center justify-center text-gray-400"
                            onmousedown="sendCommand('rotate_left')" onmouseup="sendCommand('stop')" ontouchstart="sendCommand('rotate_left')" ontouchend="sendCommand('stop')">
                        <span class="text-lg">↺</span>
                        <span class="text-[10px] font-mono">Q</span>
                    </button>
                    
                    <button id="btn-w" data-key="w" class="h-14 bg-gray-700 rounded hover:bg-gray-600 active:bg-tech-500 active:text-white border-b-2 border-gray-950 active:border-b-0 active:translate-y-[2px] transition-all flex items-center justify-center text-white font-bold shadow-lg shadow-tech-900/20"
                            onmousedown="sendCommand('forward')" onmouseup="sendCommand('stop')" ontouchstart="sendCommand('forward')" ontouchend="sendCommand('stop')">W</button>
                    
                    <button id="btn-e" data-key="e" class="h-14 bg-gray-800 rounded hover:bg-gray-700 active:bg-tech-600 active:text-white border-b-2 border-gray-950 active:border-b-0 active:translate-y-[2px] transition-all flex flex-col items-center justify-center text-gray-400"
                            onmousedown="sendCommand('rotate_right')" onmouseup="sendCommand('stop')" ontouchstart="sendCommand('rotate_right')" ontouchend="sendCommand('stop')">
                        <span class="text-lg">↻</span>
                        <span class="text-[10px] font-mono">E</span>
                    </button>
                    
                    <button id="btn-a" data-key="a" class="h-14 bg-gray-700 rounded hover:bg-gray-600 active:bg-tech-500 active:text-white border-b-2 border-gray-950 active:border-b-0 active:translate-y-[2px] transition-all flex items-center justify-center text-white font-bold"
                            onmousedown="sendCommand('left')" onmouseup="sendCommand('stop')" ontouchstart="sendCommand('left')" ontouchend="sendCommand('stop')">A</button>
                    
                    <button id="btn-space" data-key=" " class="h-14 bg-red-900/30 text-red-400 border-red-900/50 border border-b-2 rounded active:bg-red-600 active:text-white active:border-b-0 active:translate-y-[2px] transition-all flex items-center justify-center"
                            onclick="sendCommand('stop')">停止</button>
                    
                    <button id="btn-d" data-key="d" class="h-14 bg-gray-700 rounded hover:bg-gray-600 active:bg-tech-500 active:text-white border-b-2 border-gray-950 active:border-b-0 active:translate-y-[2px] transition-all flex items-center justify-center text-white font-bold"
                            onmousedown="sendCommand('right')" onmouseup="sendCommand('stop')" ontouchstart="sendCommand('right')" ontouchend="sendCommand('stop')">D</button>
                    
                    <div class="opacity-0"></div>
                    <button id="btn-s" data-key="s" class="h-14 bg-gray-700 rounded hover:bg-gray-600 active:bg-tech-500 active:text-white border-b-2 border-gray-950 active:border-b-0 active:translate-y-[2px] transition-all flex items-center justify-center text-white font-bold"
                            onmousedown="sendCommand('backward')" onmouseup="sendCommand('stop')" ontouchstart="sendCommand('backward')" ontouchend="sendCommand('stop')">S</button>
                    <div class="opacity-0"></div>
                </div>
            </div>

            <!-- 手势控制按钮 - 更显眼 -->
            <div class="px-5 py-4 border-b border-gray-800/50 flex gap-3">
                <button id="gesture-toggle-btn" onclick="toggleGestureControl()" class="flex-1 py-4 px-2 text-sm font-bold bg-gradient-to-r from-tech-500 to-tech-600 hover:from-tech-400 hover:to-tech-500 text-white border-2 border-tech-400 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg shadow-tech-500/30 hover:shadow-tech-500/50 active:scale-95 transform">
                    <span class="text-xl">✋</span>
                    <span>手势控制</span>
                </button>
                <button id="face-control-btn" onclick="toggleFaceControl()" class="flex-1 py-4 px-2 text-sm font-bold bg-gray-800 hover:bg-gray-700 text-gray-400 border-2 border-gray-700 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg hover:shadow-gray-500/30 active:scale-95 transform">
                    <span class="text-xl">☺</span>
                    <span>人脸控制</span>
                </button>
            </div>

            <!-- 语音对讲面板 -->
            <div id="audio-panel" class="flex-none px-5 py-4 border-b border-gray-800/50">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path></svg>
                        语音对讲
                    </h3>
                    <span id="audio-badge" class="text-[10px] font-mono px-2 py-0.5 rounded border border-gray-700 text-gray-500">检测中…</span>
                </div>

                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button id="audio-listen-btn" type="button"
                            class="h-12 rounded-lg border-2 border-gray-700 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-sm flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed"
                            disabled>
                        <span class="text-lg">🔊</span><span id="audio-listen-label">监听车端</span>
                    </button>
                    <button id="audio-ptt-btn" type="button"
                            class="h-12 rounded-lg border-2 border-gray-700 bg-gray-800 text-gray-500 font-bold text-sm flex items-center justify-center gap-2 transition-all active:scale-95 select-none disabled:opacity-40 disabled:cursor-not-allowed"
                            disabled>
                        <span class="text-lg">🎙</span><span id="audio-ptt-label">按住说话</span>
                    </button>
                </div>

                <div class="space-y-1.5 mb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-8 text-[10px] font-mono text-gray-500">车端</span>
                        <div class="flex-1 h-1.5 bg-gray-800 rounded overflow-hidden">
                            <div id="audio-meter-remote" class="h-full bg-tech-500" style="width:0%"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-8 text-[10px] font-mono text-gray-500">本地</span>
                        <div class="flex-1 h-1.5 bg-gray-800 rounded overflow-hidden">
                            <div id="audio-meter-local" class="h-full bg-green-500" style="width:0%"></div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-mono text-gray-500">音量</span>
                    <input id="audio-volume" type="range" min="0" max="150" value="100" step="5"
                           class="flex-1 h-1 bg-gray-800 rounded appearance-none cursor-pointer" style="accent-color:#0ea5e9" />
                    <span id="audio-volume-value" class="w-9 text-right text-[10px] font-mono text-tech-400">100</span>
                </div>

                <details id="audio-advanced" class="mt-3 border-t border-gray-800/60 pt-2">
                    <summary class="text-[10px] text-gray-500 cursor-pointer hover:text-gray-300 select-none">设备与自检</summary>
                    <div class="mt-2 space-y-2">
                        <label class="block">
                            <span class="text-[10px] text-gray-500 font-mono">车端麦克风</span>
                            <select id="audio-capture-device" class="w-full mt-1 bg-gray-950 border border-gray-700 rounded px-2 py-1 text-[11px] text-gray-300"></select>
                        </label>
                        <label class="block">
                            <span class="text-[10px] text-gray-500 font-mono">车端扬声器</span>
                            <select id="audio-playback-device" class="w-full mt-1 bg-gray-950 border border-gray-700 rounded px-2 py-1 text-[11px] text-gray-300"></select>
                        </label>
                        <input id="audio-custom-device" type="text" placeholder="自定义设备（可选），如 plughw:1,0；留空则用上面的选择"
                               class="w-full bg-gray-950 border border-gray-700 rounded px-2 py-1 text-[11px] text-gray-300 placeholder-gray-600" />
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="applyAudioDevices()"
                                    class="py-1.5 text-[11px] bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-gray-300 transition-colors">应用设备</button>
                            <button type="button" onclick="runAudioSelfCheck()"
                                    class="py-1.5 text-[11px] bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-tech-400 transition-colors">运行自检</button>
                        </div>
                        <div id="audio-diagnostics" class="text-[10px] font-mono text-gray-500 whitespace-pre-wrap leading-relaxed"></div>
                    </div>
                </details>

                <div id="audio-hint" class="mt-2 text-[10px] text-gray-500 leading-relaxed"></div>
            </div>

            <!-- 自动打招呼面板 -->
            <div id="greeting-panel" class="flex-none px-5 py-4 border-b border-gray-800/50">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        自动招呼
                    </h3>
                    <button id="greeting-toggle" type="button" onclick="toggleGreeting()"
                            class="px-3 py-1 text-[10px] font-bold bg-gray-800 border border-gray-700 rounded text-gray-400 hover:bg-gray-700 transition-colors">
                        读取中…
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div class="bg-gray-950/60 border border-gray-800 rounded px-2 py-1.5">
                        <div class="text-[9px] text-gray-600 font-mono uppercase">状态</div>
                        <div id="greeting-state" class="text-[11px] font-mono text-gray-400">--</div>
                    </div>
                    <div class="bg-gray-950/60 border border-gray-800 rounded px-2 py-1.5">
                        <div class="text-[9px] text-gray-600 font-mono uppercase">已招呼</div>
                        <div id="greeting-count" class="text-[11px] font-mono text-tech-400">0</div>
                    </div>
                </div>

                <div id="greeting-detail" class="text-[10px] font-mono text-gray-500 leading-relaxed whitespace-pre-wrap"></div>

                <button type="button" onclick="testGreeting(this)"
                        class="mt-2 w-full py-1.5 text-[11px] bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-gray-300 transition-colors">
                    试一次（立刻打招呼）
                </button>
            </div>

            <!-- 预设动作面板 -->
            <div class="flex-none px-5 py-4 border-b border-gray-800/50">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                        预设动作
                    </h3>
                    <button id="action-stop-btn" onclick="stopPresetAction()" class="hidden px-2 py-1 text-[10px] bg-red-900/40 hover:bg-red-600 border border-red-800/50 hover:border-red-500 rounded text-red-300 hover:text-white transition-colors font-bold">⏹ 急停</button>
                </div>
                <div id="preset-actions-grid" class="grid grid-cols-4 gap-2">
                    <div class="col-span-4 text-center text-[10px] text-gray-600 font-mono py-2">动作加载中...</div>
                </div>
            </div>

            <div class="flex-1 p-5 flex flex-col min-h-0 overflow-y-auto scrollbar-hide">
                <div class="flex justify-between items-end mb-4">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        机械臂控制
                    </h3>
                    <div class="flex gap-2 items-center">
                        <button onclick="resetArmToHome()" class="px-2 py-1 text-[10px] bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-gray-300 transition-colors">归位</button>
                        <button onclick="getCurrentArmPosition()" class="px-2 py-1 text-[10px] bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded text-tech-400 transition-colors">校准</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-x-4 gap-y-5">
                    <div class="space-y-4">
                        <div class="group">
                            <div class="flex justify-between mb-1"><span class="text-[10px] text-gray-500 font-mono">肩部水平</span><span id="shoulder-pan-value" class="text-[10px] text-tech-400 font-mono">0</span></div>
                            <div class="flex items-center gap-1">
                                <button onmousedown="startAdjustSlider('shoulder-pan', -2)" onmouseup="stopAdjustSlider()" onmouseleave="stopAdjustSlider()" ontouchstart="startAdjustSlider('shoulder-pan', -2)" ontouchend="stopAdjustSlider()" class="slider-arrow-btn w-6 h-6 flex items-center justify-center bg-gray-800 hover:bg-gray-700 active:bg-tech-600 rounded text-gray-400 hover:text-white text-xs transition-all">◀</button>
                                <input type="range" id="shoulder-pan" class="arm-slider flex-1" min="-60" max="60" value="0" step="1" data-joint="arm_shoulder_pan.pos">
                                <button onmousedown="startAdjustSlider('shoulder-pan', 2)" onmouseup="stopAdjustSlider()" onmouseleave="stopAdjustSlider()" ontouchstart="startAdjustSlider('shoulder-pan', 2)" ontouchend="stopAdjustSlider()" class="slider-arrow-btn w-6 h-6 flex items-center justify-center bg-gray-800 hover:bg-gray-700 active:bg-tech-600 rounded text-gray-400 hover:text-white text-xs transition-all">▶</button>
                            </div>
                        </div>
                        <div class="group">
                            <div class="flex justify-between mb-1"><span class="text-[10px] text-gray-500 font-mono">肩部垂直</span><span id="shoulder-lift-value" class="text-[10px] text-tech-400 font-mono">0</span></div>
                            <div class="flex items-center gap-1">

                                <input type="range" id="shoulder-lift" class="arm-slider flex-1" min="-55" max="55" value="0" step="1" data-joint="arm_shoulder_lift.pos">

                            <div class="flex items-center gap-1">

        <div class="bg-red-600/90 backdrop-blur-sm border-2 border-red-400 rounded-xl p-6 shadow-2xl shadow-red-500/50">
            <div class="text-center">
                <div class="text-xs text-red-200 mb-2 font-semibold uppercase tracking-wider">剩余时间</div>
                <div id="countdown-number" class="text-6xl font-bold text-white mb-2 drop-shadow-[0_0_20px_rgba(255,255,255,0.5)] animate-pulse">
                    10
                </div>
                <div class="text-sm text-red-100">控制时间即将结束</div>
            </div>
        </div>
    </div>

    <!-- 手势控制预览窗口 -->
    <div id="gesture-preview-container" class="hidden fixed bottom-6 right-6 z-40 bg-gray-900/90 backdrop-blur border border-gray-700 rounded-lg shadow-2xl overflow-hidden w-80 h-60 min-w-[200px] min-h-[150px]" style="resize: both;">
        <div id="gesture-drag-handle" class="absolute top-0 left-0 w-full h-8 z-10 flex items-center gap-2 bg-gradient-to-b from-black/80 to-transparent px-3 cursor-move select-none">
            <div class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
            <span class="text-[10px] text-white font-mono uppercase tracking-wider shadow-black drop-shadow-md flex-1">Live Input</span>
            <!-- 遮罩切换按钮 -->

                🎭 隐藏遮罩
            </button>
        </div>
        <video id="gesture-video" class="hidden w-full h-full object-cover transform -scale-x-100 pointer-events-none" autoplay playsinline muted></video>
        <canvas id="gesture-canvas" width="320" height="240" class="w-full h-full object-cover transform -scale-x-100 pointer-events-none"></canvas>
    </div>

    <script>
        // 语音对讲：服务端注入的配置（ws 地址 / 采样率 / 包长）
        window.MOYU_AUDIO = {{ (audio_config or {}) | tojson }};
        window.MOYU_AUDIO.worklet_url = {{ url_for('static', filename='audio_capture_worklet.js') | tojson }};
    </script>
    <script src="{{ url_for('static', filename='gesture_control.js') }}"></script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
